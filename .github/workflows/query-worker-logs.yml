name: Query Worker Logs

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "検索キーワード（$metadata.messageの部分一致・省略可）"
        required: false
        default: ""
      since:
        description: "遡る期間。例: 30m, 6h, 2d"
        required: false
        default: "3h"
      limit:
        description: "取得件数上限"
        required: false
        default: "200"
      request_id:
        description: "$metadata.requestIdの完全一致（1回のWorker呼び出しの全ログ行を相関させたい場合・省略可）"
        required: false
        default: ""

jobs:
  query-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Query Cloudflare Workers Logs
        run: |
          node scripts/query-worker-logs.mjs \
            ${{ inputs.grep != '' && format('--grep "{0}"', inputs.grep) || '' }} \
            ${{ inputs.request_id != '' && format('--request-id "{0}"', inputs.request_id) || '' }} \
            --since "${{ inputs.since }}" \
            --limit "${{ inputs.limit }}"
        env:
          CLOUDFLARE_API_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
